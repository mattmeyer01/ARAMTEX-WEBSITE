# Konfiguracja Netlify dla statycznej strony Armatex.
# Strona nie ma procesu budowania: publikujemy katalog glowny repo.

[build]
  publish = "."
  command = ""

# Dlugi cache dla wersjonowanych zasobow (?v=n w linkach robi reszte)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML zawsze swiezy (koniec z czekaniem na cache po zmianach)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
